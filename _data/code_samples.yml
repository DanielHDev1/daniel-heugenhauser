walk_the_dog_quest_manager:
  title: "Code example: QuestManager lifecycle"
  description: "A condensed version of the production QuestManager, edited for readability. It loads ScriptableObject quests, restores saved progress, completes levels, and unlocks the next quest."
  language: csharp
  code: |-
    using System;
    using System.Linq;
    using Data;
    using UnityEngine;

    namespace Logic.Quest
    {
        public sealed class QuestManager : IQuestManager
        {
            private const string QuestsPath = "Quests";
            private const string ActiveQuestKey = "ActiveQuestIndex";

            private QuestScriptableObject[] quests =
                Array.Empty<QuestScriptableObject>();

            public int ActiveQuestId { get; private set; }

            public QuestManager()
            {
                LoadQuests();
                RestoreQuestState();
            }

            private void LoadQuests()
            {
                quests = Resources.LoadAll<QuestScriptableObject>(QuestsPath);

                foreach (QuestScriptableObject quest in quests)
                {
                    quest.Reset();
                }
            }

            private void RestoreQuestState()
            {
                if (quests.Length == 0)
                {
                    Debug.LogWarning($"No quests found in Resources/{QuestsPath}.");
                    return;
                }

                if (SaveManager.IsSaveDataAvailable(
                    SaveManager.QUEST_SAVE_FILE_PATH))
                {
                    SaveManager.LoadQuestData(ref quests);

                    int savedQuestId = PlayerPrefs.GetInt(ActiveQuestKey, 0);
                    QuestScriptableObject savedQuest = FindQuestById(savedQuestId);

                    if (savedQuest != null &&
                        savedQuest.questState != QuestState.Locked)
                    {
                        ActiveQuestId = savedQuestId;

                        if (savedQuest.questState != QuestState.Completed)
                        {
                            savedQuest.questState = QuestState.Active;
                        }

                        return;
                    }
                }

                InitializeQuests();
                StartQuest(quests[0].questID);
            }

            private void InitializeQuests()
            {
                for (int i = 0; i < quests.Length; i++)
                {
                    quests[i].questState = i == 0
                        ? QuestState.Unlocked
                        : QuestState.Locked;
                }
            }

            public void StartQuest(int questId)
            {
                QuestScriptableObject quest = FindQuestById(questId);

                if (quest == null || quest.questState == QuestState.Locked)
                {
                    Debug.LogWarning($"Quest {questId} is locked or missing.");
                    return;
                }

                ActiveQuestId = quest.questID;
                quest.questState = QuestState.Active;

                PlayerPrefs.SetInt(ActiveQuestKey, ActiveQuestId);
                PlayerPrefs.Save();
                SaveManager.SaveQuestData(quests);
            }

            public void CompleteLevel(int questId, int levelIndex)
            {
                QuestScriptableObject quest = FindQuestById(questId);
                QuestLevel level = quest?.GetLevel(levelIndex);

                if (quest == null || level == null ||
                    level.isLevelCompleted || level.bonesCount <= 0)
                {
                    Debug.LogWarning(
                        $"Level {levelIndex} in quest {questId} cannot be completed.");
                    return;
                }

                level.CompleteLevel();

                if (quest.IsQuestFullyCompleted())
                {
                    quest.CompleteQuest();
                    UnlockNextQuest(quest.questID);
                }

                SaveManager.SaveQuestData(quests);
            }

            private void UnlockNextQuest(int completedQuestId)
            {
                QuestScriptableObject nextQuest = quests
                    .Where(quest => quest.questID > completedQuestId)
                    .OrderBy(quest => quest.questID)
                    .FirstOrDefault();

                if (nextQuest == null)
                {
                    return;
                }

                nextQuest.questState = QuestState.Unlocked;
                PlayerPrefs.SetInt(ActiveQuestKey, nextQuest.questID);
                PlayerPrefs.Save();
            }

            private QuestScriptableObject FindQuestById(int questId)
            {
                return quests.FirstOrDefault(quest => quest.questID == questId);
            }
        }
    }

walk_the_dog_quest_service_registration:
  title: "Code example: QuestManager service registration"
  description: "At startup, the QuestManager is registered behind its interface so gameplay and UI systems can access the shared quest state without constructing their own instances."
  language: csharp
  code: |-
    private void RegisterServices()
    {
        ServiceLocator.RegisterService<IQuestManager, QuestManager>(
            new QuestManager());
    }

walk_the_dog_quest_save_serialization:
  title: "Code example: quest save serialization"
  description: "This method converts nested quest and level state into serializable data before saving it as JSON in Unity's persistent data directory."
  language: csharp
  code: |-
    public static void SaveQuestData(QuestScriptableObject[] questList)
    {
        List<QuestData> questDataList = questList.Select(quest => new QuestData
        {
            questID = quest.questID,
            questState = quest.questState,
            totalExp = quest.totalEXP,
            newMessageIndicator = quest.newMessageIndicator,
            levels = quest.questLevels.Select(level => new QuestData.LevelData
            {
                levelIndex = level.levelIndex,
                levelNumber = level.levelNumber,
                isLevelCompleted = level.isLevelCompleted,
                isLevelActive = level.isLevelActive,
                bonesCount = level.bonesCount,
                levelHeat = level.levelHeat,
                levelExp = level.levelEXP
            }).ToList()
        }).ToList();

        string jsonData = JsonUtility.ToJson(
            new QuestDataList { quests = questDataList }, true);
        File.WriteAllText(
            Application.persistentDataPath + "/" + QUEST_SAVE_FILE_PATH,
            jsonData);

        Debug.Log("Quest data saved successfully.");
    }
