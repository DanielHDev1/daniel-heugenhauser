walk_the_dog_quest_manager:
  title: "Code example: QuestManager lifecycle"
  description: "A condensed version of the production QuestManager, edited for readability. It loads ScriptableObject quests, restores saved progress, completes levels, and unlocks the next quest."
  language: csharp
  code: |-
    using System;
    using System.Linq;
    using Data;
    using UnityEngine;

    namespace Logic.Quest
    {
        public sealed class QuestManager : IQuestManager
        {
            private const string QuestsPath = "Quests";
            private const string ActiveQuestKey = "ActiveQuestIndex";

            private QuestScriptableObject[] quests =
                Array.Empty<QuestScriptableObject>();

            public int ActiveQuestId { get; private set; }

            public QuestManager()
            {
                LoadQuests();
                RestoreQuestState();
            }

            private void LoadQuests()
            {
                quests = Resources.LoadAll<QuestScriptableObject>(QuestsPath);

                foreach (QuestScriptableObject quest in quests)
                {
                    quest.Reset();
                }
            }

            private void RestoreQuestState()
            {
                if (quests.Length == 0)
                {
                    Debug.LogWarning($"No quests found in Resources/{QuestsPath}.");
                    return;
                }

                if (SaveManager.IsSaveDataAvailable(
                    SaveManager.QUEST_SAVE_FILE_PATH))
                {
                    SaveManager.LoadQuestData(ref quests);

                    int savedQuestId = PlayerPrefs.GetInt(ActiveQuestKey, 0);
                    QuestScriptableObject savedQuest = FindQuestById(savedQuestId);

                    if (savedQuest != null &&
                        savedQuest.questState != QuestState.Locked)
                    {
                        ActiveQuestId = savedQuestId;

                        if (savedQuest.questState != QuestState.Completed)
                        {
                            savedQuest.questState = QuestState.Active;
                        }

                        return;
                    }
                }

                InitializeQuests();
                StartQuest(quests[0].questID);
            }

            private void InitializeQuests()
            {
                for (int i = 0; i < quests.Length; i++)
                {
                    quests[i].questState = i == 0
                        ? QuestState.Unlocked
                        : QuestState.Locked;
                }
            }

            public void StartQuest(int questId)
            {
                QuestScriptableObject quest = FindQuestById(questId);

                if (quest == null || quest.questState == QuestState.Locked)
                {
                    Debug.LogWarning($"Quest {questId} is locked or missing.");
                    return;
                }

                ActiveQuestId = quest.questID;
                quest.questState = QuestState.Active;

                PlayerPrefs.SetInt(ActiveQuestKey, ActiveQuestId);
                PlayerPrefs.Save();
                SaveManager.SaveQuestData(quests);
            }

            public void CompleteLevel(int questId, int levelIndex)
            {
                QuestScriptableObject quest = FindQuestById(questId);
                QuestLevel level = quest?.GetLevel(levelIndex);

                if (quest == null || level == null ||
                    level.isLevelCompleted || level.bonesCount <= 0)
                {
                    Debug.LogWarning(
                        $"Level {levelIndex} in quest {questId} cannot be completed.");
                    return;
                }

                level.CompleteLevel();

                if (quest.IsQuestFullyCompleted())
                {
                    quest.CompleteQuest();
                    UnlockNextQuest(quest.questID);
                }

                SaveManager.SaveQuestData(quests);
            }

            private void UnlockNextQuest(int completedQuestId)
            {
                QuestScriptableObject nextQuest = quests
                    .Where(quest => quest.questID > completedQuestId)
                    .OrderBy(quest => quest.questID)
                    .FirstOrDefault();

                if (nextQuest == null)
                {
                    return;
                }

                nextQuest.questState = QuestState.Unlocked;
                PlayerPrefs.SetInt(ActiveQuestKey, nextQuest.questID);
                PlayerPrefs.Save();
            }

            private QuestScriptableObject FindQuestById(int questId)
            {
                return quests.FirstOrDefault(quest => quest.questID == questId);
            }
        }
    }

walk_the_dog_quest_service_registration:
  title: "Code example: QuestManager service registration"
  description: "At startup, the QuestManager is registered behind its interface so gameplay and UI systems can access the shared quest state without constructing their own instances."
  language: csharp
  code: |-
    private void RegisterServices()
    {
        ServiceLocator.RegisterService<IQuestManager, QuestManager>(
            new QuestManager());
    }

walk_the_dog_quest_save_serialization:
  title: "Code example: quest save serialization"
  description: "This method converts nested quest and level state into serializable data before saving it as JSON in Unity's persistent data directory."
  language: csharp
  code: |-
    public static void SaveQuestData(QuestScriptableObject[] questList)
    {
        List<QuestData> questDataList = questList.Select(quest => new QuestData
        {
            questID = quest.questID,
            questState = quest.questState,
            totalExp = quest.totalEXP,
            newMessageIndicator = quest.newMessageIndicator,
            levels = quest.questLevels.Select(level => new QuestData.LevelData
            {
                levelIndex = level.levelIndex,
                levelNumber = level.levelNumber,
                isLevelCompleted = level.isLevelCompleted,
                isLevelActive = level.isLevelActive,
                bonesCount = level.bonesCount,
                levelHeat = level.levelHeat,
                levelExp = level.levelEXP
            }).ToList()
        }).ToList();

        string jsonData = JsonUtility.ToJson(
            new QuestDataList { quests = questDataList }, true);
        File.WriteAllText(
            Application.persistentDataPath + "/" + QUEST_SAVE_FILE_PATH,
            jsonData);

        Debug.Log("Quest data saved successfully.");
    }

crops_and_corpses_zombie_navigation:
  title: "Code example: zombie navigation state"
  description: "The chase state follows the navigation path toward the player and returns the zombie to its idle state when the target is too far away or unavailable."
  language: csharp
  code: |-
    public override void Physics_Update(double delta)
    {
        if (_player != null)
        {
            _moveSpeed = ZombieManager.chaseSpeed;
            Vector2 playerDirection =
                _player.GlobalPosition - _zombie.GlobalPosition;

            if (playerDirection.Length() > 80)
            {
                ChasePlayer();
            }
            else
            {
                _zombie.Velocity = Vector2.Zero;
            }

            if (playerDirection.Length() > 600)
            {
                _timer.Stop();
                EmitSignal("Transitioned", "idle");
            }
        }
        else
        {
            _timer.Stop();
            EmitSignal("Transitioned", "idle");
        }
    }

    private void ChasePlayer()
    {
        Vector2 nextPathPosition = _navAgent.GetNextPathPosition();
        Vector2 newVelocity =
            (nextPathPosition - _zombie.GlobalPosition).Normalized();

        _zombie.Velocity = newVelocity * _moveSpeed;
    }

crops_and_corpses_time_manager:
  title: "Code example: day and night cycle"
  description: "This cleaned-up Godot manager uses configurable cycle timings, restores persisted lighting, advances the day counter, and keeps the delayed zombie-wave state separate from the visual day/night transition."
  language: csharp
  code: |-
    using Godot;

    public partial class TimeManager : Node
    {
        private const string GlobalTimePath = "/root/GlobalTime";
        private const string SunlightPath = "Sunlight";

        [ExportGroup("Cycle timings")]
        [Export] private float dayDurationSeconds = 300f;
        [Export] private float nightDurationSeconds = 150f;
        [Export] private float zombieDelaySeconds = 60f;

        [ExportGroup("Lighting")]
        [Export] private Color dayColor = Colors.White;
        [Export] private Color nightColor = new(0.5f, 0.5f, 0.5f);
        [Export] private float transitionDurationSeconds = 3f;

        public static bool IsDaytime { get; private set; } = true;

        private GlobalTime globalTime;
        private CanvasModulate sunlight;
        private int dayCounter;
        private bool wasDaylight;
        private bool usesOutdoorLighting;

        public override void _Ready()
        {
            globalTime = GetNode<GlobalTime>(GlobalTimePath);
            sunlight = GetNodeOrNull<CanvasModulate>(SunlightPath);
            usesOutdoorLighting = sunlight != null &&
                SceneManager.GetCurrentScene(this) != Scene.Cave;

            dayCounter = globalTime.GetDay();

            float timeOfDay = GetTimeOfDay();
            wasDaylight = IsWithinDaylight(timeOfDay);
            IsDaytime = IsWithinGameplayDay(timeOfDay);

            if (usesOutdoorLighting)
            {
                sunlight.Color = globalTime.GetColor();
            }
            else if (sunlight == null)
            {
                GD.PushWarning("Sunlight was not found; lighting is disabled.");
            }
        }

        public override void _Process(double delta)
        {
            float timeOfDay = GetTimeOfDay();
            bool isDaylight = IsWithinDaylight(timeOfDay);

            if (!wasDaylight && isDaylight)
            {
                dayCounter++;
                globalTime.SetDay(dayCounter);
            }

            wasDaylight = isDaylight;
            IsDaytime = IsWithinGameplayDay(timeOfDay);

            if (!usesOutdoorLighting)
            {
                return;
            }

            Color targetColor = isDaylight ? dayColor : nightColor;
            float transitionWeight = GetTransitionWeight(delta);

            sunlight.Color = InterpolateColor(
                sunlight.Color,
                targetColor,
                transitionWeight);
            globalTime.SetColor(sunlight.Color);
        }

        private float GetTimeOfDay()
        {
            float cycleDuration = dayDurationSeconds + nightDurationSeconds;
            return Mathf.PosMod(globalTime.GetTime(), cycleDuration);
        }

        private bool IsWithinDaylight(float timeOfDay)
        {
            return timeOfDay < dayDurationSeconds;
        }

        private bool IsWithinGameplayDay(float timeOfDay)
        {
            float delay = Mathf.Min(zombieDelaySeconds, nightDurationSeconds);
            return timeOfDay < dayDurationSeconds + delay;
        }

        private float GetTransitionWeight(double delta)
        {
            if (transitionDurationSeconds <= 0f)
            {
                return 1f;
            }

            return 1f - Mathf.Exp(
                -(float)delta / transitionDurationSeconds);
        }

        private static Color InterpolateColor(
            Color from,
            Color to,
            float weight)
        {
            return new Color(
                Mathf.Lerp(from.R, to.R, weight),
                Mathf.Lerp(from.G, to.G, weight),
                Mathf.Lerp(from.B, to.B, weight),
                Mathf.Lerp(from.A, to.A, weight));
        }
    }

crops_and_corpses_zombie_manager:
  title: "Code example: adaptive zombie difficulty"
  description: "A condensed version of the production ZombieManager, edited for readability. It selects a zombie tier from the day/night state and recent kill pressure, then applies centralized town and horde modifiers to immutable base stats."
  language: csharp
  code: |-
    using Godot;

    public partial class ZombieManager : Node
    {
        private const string StatsTimerPath = "Timer";
        private const float StrongTierThreshold = 5f;
        private const float HordeBonusThreshold = 10f;
        private const float KillPressureDecayPerSecond = 0.2f;
        private const float MinimumAttackCooldownSeconds = 0.1f;

        public enum ZombieTier
        {
            Weak,
            Medium,
            Strong
        }

        public readonly record struct ZombieStats(
            int Damage,
            float AttackCooldownSeconds,
            float IdleSpeed,
            float ChaseSpeed)
        {
            public ZombieStats Apply(ZombieStats modifier)
            {
                return new ZombieStats(
                    Damage + modifier.Damage,
                    Mathf.Max(
                        MinimumAttackCooldownSeconds,
                        AttackCooldownSeconds +
                            modifier.AttackCooldownSeconds),
                    IdleSpeed + modifier.IdleSpeed,
                    ChaseSpeed + modifier.ChaseSpeed);
            }
        }

        private static readonly ZombieStats WeakStats =
            new(5, 1.5f, 100f, 150f);
        private static readonly ZombieStats MediumStats =
            new(10, 1f, 150f, 200f);
        private static readonly ZombieStats StrongStats =
            new(15, 1f, 200f, 250f);

        private static readonly ZombieStats HordeModifier =
            new(20, -0.6f, 30f, 30f);

        private static readonly ZombieStats[] TownLevelModifiers =
        {
            default,
            default,
            new(3, -0.2f, 30f, 30f),
            new(5, -0.3f, 40f, 40f),
            new(7, -0.5f, 50f, 50f),
            new(10, -0.5f, 80f, 80f)
        };

        [Export(PropertyHint.Range, "0.1,10,0.1")]
        private double refreshIntervalSeconds = 1d;

        public static ZombieTier CurrentTier { get; private set; }
        public static ZombieStats CurrentStats { get; private set; }
        public static float KillPressure { get; private set; }

        private Timer statsTimer;

        public override void _Ready()
        {
            statsTimer = GetNode<Timer>(StatsTimerPath);
            statsTimer.WaitTime = refreshIntervalSeconds;
            statsTimer.Timeout += RefreshStats;
            statsTimer.Start();

            RefreshStats();
        }

        public override void _ExitTree()
        {
            statsTimer.Timeout -= RefreshStats;
        }

        public static void RegisterKill()
        {
            KillPressure++;
        }

        private void RefreshStats()
        {
            DecayKillPressure();

            CurrentTier = SelectTier(
                TimeManager.IsDaytime,
                KillPressure);

            ZombieStats stats = GetBaseStats(CurrentTier);
            stats = stats.Apply(GetTownModifier());

            if (KillPressure > HordeBonusThreshold)
            {
                stats = stats.Apply(HordeModifier);
            }

            CurrentStats = stats;
        }

        private void DecayKillPressure()
        {
            float decay = KillPressureDecayPerSecond *
                (float)refreshIntervalSeconds;
            KillPressure = Mathf.Max(0f, KillPressure - decay);
        }

        private static ZombieTier SelectTier(
            bool isDaytime,
            float killPressure)
        {
            if (isDaytime)
            {
                return ZombieTier.Weak;
            }

            return killPressure > StrongTierThreshold
                ? ZombieTier.Strong
                : ZombieTier.Medium;
        }

        private static ZombieStats GetBaseStats(ZombieTier tier)
        {
            return tier switch
            {
                ZombieTier.Weak => WeakStats,
                ZombieTier.Medium => MediumStats,
                ZombieTier.Strong => StrongStats,
                _ => WeakStats
            };
        }

        private static ZombieStats GetTownModifier()
        {
            int townLevel = TownManager.currentTownStats?.townHallLevel ?? 0;
            int modifierIndex = Mathf.Clamp(
                townLevel,
                0,
                TownLevelModifiers.Length - 1);

            return TownLevelModifiers[modifierIndex];
        }
    }

yeti_farm_adaptive_difficulty:
  title: "Code example: adaptive minigame difficulty"
  description: "Difficulty changes the probability of special mole types and shortens how long each mole remains visible."
  language: csharp
  code: |-
    private void SetLevel(int level)
    {
        bombRate = Mathf.Min(level * 0.025f, 0.25f);
        hardRate = Mathf.Min(level * 0.025f, 1f);

        float durationMin =
            Mathf.Clamp(1 - level * 0.1f, 0.01f, 1f);
        float durationMax =
            Mathf.Clamp(2 - level * 0.1f, 0.01f, 2f);

        duration = Random.Range(durationMin, durationMax);
    }

    public void Activate(int level)
    {
        grabAnimationDuration = gameManager.grabTimer;
        SetLevel(level);
        CreateNext();
        StartCoroutine(ShowHide(startPosition, endPosition));
    }
